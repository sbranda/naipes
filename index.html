:root{--navy:#14213D;--deep:#0B1428;--cream:#F4EAD2;--gold:#F2B705;--red:#C8352E;--green:#4C956C;
  --disp:"Bebas Neue",Impact,"Arial Narrow",Haettenschweiler,sans-serif;
  --txt:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--cream);font-family:var(--txt);font-size:18px}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:480px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-family:var(--disp);font-weight:400;font-size:36px;letter-spacing:.03em;line-height:1.05}
h2{margin:0;font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
.sub{color:#F4EAD2B3;letter-spacing:.06em;font-weight:500}
.btn{border:2px solid var(--cream);background:transparent;border-radius:12px;padding:10px 16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.btn.big{background:var(--gold);color:var(--navy);border-color:var(--gold);font-size:22px;padding:14px 18px;width:100%}
.btn.sm{padding:6px 12px;font-size:15px}
.btn:active{transform:translateY(1px)}
.group{display:flex;flex-direction:column;gap:8px}
.group>label{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:#F4EAD2B3}
.opts{display:grid;gap:8px}
.opt{border:2px solid #F4EAD255;border-radius:12px;background:transparent;padding:10px 12px;text-align:left;line-height:1.2}
.opt small{display:block;color:#F4EAD2B3;font-weight:500}
.opt.on{border-color:var(--gold);background:#22325C}
.note{background:#0B142899;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.25}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.count{font-weight:600;letter-spacing:.06em;text-align:center}
.count b{font-family:var(--disp);font-size:26px;font-weight:400}
.msg{min-height:44px;background:#0B142899;border-radius:12px;padding:8px 12px;font-weight:500;line-height:1.2;display:flex;align-items:center}
.msg.win{background:#4C956C55}.msg.lose{background:#C8352E55}
.card{background:var(--cream);color:var(--navy);border:3px solid var(--deep);border-radius:20px;padding:12px;box-shadow:0 6px 0 var(--deep);display:flex;flex-direction:column;gap:8px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chead small{display:block;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#14213D99}
.chead b{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:.02em}
.num{background:var(--navy);color:var(--cream);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.photo{height:150px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:62%;height:auto}
.stats{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;border:0;border-top:1.5px solid #14213D33;background:transparent;color:inherit;min-height:50px;padding:4px;text-align:left;width:100%;border-radius:0}
.row:disabled{cursor:default}
.row .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--cream);font-family:var(--disp);font-size:18px;display:flex;align-items:center;justify-content:center}
.row .l{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.row .l i{display:block;font-style:normal;font-size:11px;letter-spacing:.04em;color:#14213D99;font-weight:500;text-transform:none;margin-top:2px}
.row .v{font-family:var(--disp);font-size:32px;line-height:1}
.row .u{font-size:13px;font-weight:600;color:#14213D99;margin-left:4px}
.row.canpick:active,.row.canpick:hover{background:#F2B70533}
.row.win{background:#4C956C55}.row.lose{background:#C8352E44}.row.tie{background:#F2B70555}
.ficha{border-top:1.5px solid #14213D33;padding-top:6px}
.ficha summary{cursor:pointer;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:4px 0}
.ficha dl{margin:4px 0 0;display:flex;flex-direction:column;gap:6px}
.ficha dt{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#14213D99}
.ficha dd{margin:0;font-size:15px;line-height:1.25}
.cfoot{font-size:13px;font-style:italic;color:#14213DB3;min-height:16px}
.card.compact .photo,.card.compact .cfoot{display:none}
.card.compact .row{min-height:44px}
.card.compact .chead b{font-size:24px}
.back{height:64px;border-radius:14px;border:3px solid var(--deep);background:repeating-linear-gradient(45deg,#14213D 0 10px,#1B2B4F 10px 20px);outline:2px solid var(--gold);outline-offset:-9px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);letter-spacing:.2em;color:var(--gold);font-size:20px}
.sw{display:flex;align-items:center;gap:12px;background:#0B142899;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.25}
.sw input{width:26px;height:26px;accent-color:#F2B705;flex:none}
.sw small{display:block;opacity:.75;font-size:14px}
body{transition:background .3s}
body[data-fondo=autos]{background:

.lote{display:flex;flex-direction:column;gap:10px}
.lote .prev{width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:#0008;border:3px solid var(--gold)}

.lote .op small{opacity:.7;font-weight:500;white-space:nowrap}
.lote .op:active{background:var(--gold);color:var(--navy)}
.lote .row2{display:flex;gap:8px}.lote .row2 .btn{flex:1}
.busq{background:#0B1428e6;border:2px solid var(--gold);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.busq .row2{display:flex;gap:8px;flex-wrap:wrap}.busq small{opacity:.75;font-size:14px;line-height:1.3}
.albums{display:grid;grid-template-columns:1fr;gap:12px}
.alb{position:relative;overflow:hidden;border:3px solid var(--gold);border-radius:16px;padding:12px 10px 12px;min-height:178px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;color:#fff;box-shadow:0 8px 18px #0009,inset 0 0 0 2px #0003}
.alb.autos{background:linear-gradient(155deg,#E4572E 0%,#B3261E 55%,#6E0F1A 100%)}
.alb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(180deg,#0004 0 10px,#fff3 10px 12px)}
.alb .col{position:absolute;top:10px;left:22px;right:8px;height:76px}
.alb .col i{position:absolute;top:0;width:58px;height:58px;border-radius:8px;border:3px solid #fff;background:#0004 center/cover;box-shadow:0 3px 8px #0008;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px}
.alb .col i:nth-child(1){left:0;transform:rotate(-9deg)}
.alb .col i:nth-child(2){left:34px;top:6px;transform:rotate(4deg);z-index:1}
.alb .col i:nth-child(3){left:66px;top:0;transform:rotate(12deg);z-index:2}
.alb b{font-family:var(--disp);font-weight:400;font-size:28px;letter-spacing:.05em;line-height:1;margin-left:12px;text-shadow:0 2px 0 #0006}
.alb small{margin-left:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:#ffffffcc}
.prog{height:9px;border-radius:6px;background:#0006;overflow:hidden;margin-left:12px;margin-top:2px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFE27A);border-radius:6px;transition:width .4s}
.hero{position:relative;overflow:hidden;border:3px solid var(--gold);border-radius:18px;padding:16px 16px 14px;color:#fff;box-shadow:0 8px 20px #0009}
.hero.autos{background:linear-gradient(155deg,#E4572E 0%,#B3261E 55%,#6E0F1A 100%)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(#ffffff40,#fff0 70%)}
.hero .k{font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:#ffffffcc}
.hero h2{font-size:48px;line-height:1;margin:2px 0 8px;text-shadow:0 3px 0 #0006}
.hero .prog{margin-left:0;height:12px}
.hero .cnt{display:flex;justify-content:space-between;margin-top:6px;font-weight:600;letter-spacing:.06em;font-size:15px}
.hero .win{margin-top:8px;background:var(--gold);color:var(--navy);border-radius:10px;padding:6px 10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.tile{position:relative}
.tile.ok{border-color:var(--gold);box-shadow:0 0 0 2px #F2B70066,0 6px 14px #0008}
.tile.ok .photo::after{content:"\2605";position:absolute;right:6px;top:4px;color:var(--gold);font-size:20px;text-shadow:0 1px 3px #000}
.tile.vacio{border-style:dashed;border-color:#14213D88;background:#F4EAD2d9}
.tile.vacio .photo{opacity:.5;filter:grayscale(.5)}
.tile.vacio .photo::after{content:"+";position:absolute;right:6px;bottom:2px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:700;font-size:22px;line-height:25px;text-align:center}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:10px}.folder{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--cream);background:transparent;border-radius:12px;padding:12px 8px}.folder .ic{font-size:34px;line-height:1}.folder b{letter-spacing:.08em;text-transform:uppercase}.folder small{opacity:.75;font-size:14px}
.cartools{display:flex;flex-direction:column;gap:8px;background:#0B142899;border-radius:12px;padding:10px 12px}.cartools .row2{display:flex;gap:8px;flex-wrap:wrap}.cartools summary{cursor:pointer;letter-spacing:.04em}.cartools[open] summary{margin-bottom:8px}.cartools small{display:block;margin:6px 0}.cartools small{opacity:.75;font-size:14px;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--cream);color:var(--navy);border:3px solid var(--deep);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tile .photo{height:84px}
.tile b{font-family:var(--disp);font-weight:400;font-size:20px;line-height:1.05}
.tile small{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:#14213D99}
.tile .rm{align-self:flex-start;border:1.5px solid var(--navy);background:transparent;border-radius:8px;font-size:12px;padding:2px 8px;font-weight:600}
.foot{text-align:center;color:#F4EAD299;font-size:14px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cream);color:var(--navy);padding:10px 16px;border-radius:12px;font-weight:600;display:none;max-width:90%;z-index:9}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px 0}
.fin h1{font-size:52px}

/* ===== Rediseño ===== */
html{background:#0B1428}
body{background:radial-gradient(120% 45% at 50% -8%,#33468a77,#0000 65%),repeating-linear-gradient(-55deg,#ffffff07 0 14px,#0000 14px 28px),linear-gradient(180deg,#16254a,#0B1428 70%) fixed;font-weight:500}
:root{--gold2:#9a7400}
.btn{border-radius:14px;border:2px solid #F4EAD2aa;background:#ffffff0d}
.btn.big{font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.14em;padding:10px 18px 8px;background:linear-gradient(180deg,#FFD23F,#F2B705);border:0;border-bottom:5px solid var(--gold2);border-radius:16px;box-shadow:0 8px 16px #0006;color:#14213D}
.btn.big:active{transform:translateY(3px);border-bottom-width:2px;box-shadow:0 3px 8px #0006}
.hd{position:relative;overflow:hidden;border:3px solid var(--gold);border-radius:22px;padding:22px 16px 18px;background:linear-gradient(155deg,#E4572E 0%,#B3261E 55%,#6E0F1A 100%);box-shadow:0 8px 0 #0008,0 14px 26px #0008}
.hd::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/12px 12px;opacity:.85}
.hd::after{content:"80·90";position:absolute;right:-8px;bottom:-26px;font-family:var(--disp);font-size:120px;line-height:1;color:#ffffff1f;letter-spacing:.04em;pointer-events:none}
.hd .yr{font-family:var(--disp);letter-spacing:.34em;font-size:16px;color:#FFE27A;margin-top:6px}
.hd h1{font-size:46px;line-height:.98;margin-top:2px;text-shadow:0 3px 0 #0007;color:#fff}
.hd h1 em{font-style:normal;color:var(--gold)}
.hd .sub{color:#ffffffd9;margin-top:8px;position:relative;z-index:1}
.group>label{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.14em;color:var(--gold);display:flex;align-items:center;gap:10px}
.group>label::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#F2B70088,#0000)}
.opt{display:flex;align-items:center;gap:12px;border:2px solid #F4EAD233;border-radius:16px;background:#ffffff0c;padding:12px 14px;box-shadow:0 4px 0 #0007;transition:transform .12s,border-color .12s}
.opt:active{transform:translateY(2px)}
.opt .tx{flex:1;min-width:0}
.opt b{font-family:var(--disp);font-weight:400;font-size:26px;letter-spacing:.06em;line-height:1.05;display:block}
.opt small{font-size:15px;line-height:1.2}
.opt.on{border-color:var(--gold);background:linear-gradient(180deg,#34498f,#22325C);box-shadow:0 4px 0 var(--gold2),0 0 0 3px #F2B70026}
.opt .nb{flex:none;text-align:center;font-family:var(--disp);font-size:40px;line-height:.9;color:var(--gold)}
.opt .nb small{font-family:var(--txt);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F4EAD2b3;margin-top:2px}
.opts.seg{grid-template-columns:repeat(3,1fr)}
.seg .opt{flex-direction:column;align-items:stretch;gap:2px;text-align:center;padding:10px 6px}
.seg .opt b{font-size:28px}.seg .opt small{font-size:13px}
.seg .opt.on::after{content:"\2713";position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:700;font-size:14px;line-height:22px}
.seg .opt{position:relative}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rec div{background:#0B1428aa;border:2px solid #F4EAD222;border-radius:14px;text-align:center;padding:8px 4px 6px}
.rec b{display:block;font-family:var(--disp);font-weight:400;font-size:38px;line-height:1}
.rec small{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#F4EAD2b3}
.rec .g b{color:#6fcf97}.rec .p b{color:#ff7b72}.rec .e b{color:var(--gold)}
.rules{background:#0B142899;border-radius:14px;padding:10px 14px;font-size:16px;line-height:1.3}
.rules summary{cursor:pointer;font-family:var(--disp);font-size:20px;letter-spacing:.12em;color:var(--gold)}
.rules p{margin:8px 0 0}
.note{border-radius:14px}
/* juego */
.bar{gap:8px}
.score{display:flex;gap:6px;align-items:center;justify-content:center;flex:1}
.sc{min-width:78px;background:#0B1428cc;border:2px solid #F4EAD233;border-radius:14px;padding:4px 10px 3px;text-align:center;line-height:1;transition:border-color .2s}
.sc small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#F4EAD2b3;margin-bottom:1px}
.sc b{font-family:var(--disp);font-weight:400;font-size:32px}
.sc.turno{border-color:var(--gold);box-shadow:0 0 0 3px #F2B70033}
.vs{font-family:var(--disp);color:var(--gold);font-size:18px}
.rd{font-family:var(--disp);font-size:20px;letter-spacing:.08em;color:#F4EAD2b3;min-width:34px;text-align:right}
.pozo{font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:var(--gold);margin-top:-6px}
.meter{height:8px;border-radius:6px;background:#C8352E;overflow:hidden;box-shadow:inset 0 1px 2px #0006}
.meter span{display:block;height:100%;background:linear-gradient(90deg,#8be0ad,#4C956C);transition:width .5s}
.msg{border-radius:14px;border-left:5px solid var(--gold);font-size:18px}
.msg.win{border-left-color:#6fcf97}.msg.lose{border-left-color:#ff7b72}
.card{position:relative;overflow:hidden;padding:0 12px 12px;border-radius:22px;background:linear-gradient(180deg,#FCF6E4,#EFE2BF);box-shadow:0 8px 0 var(--deep),0 16px 26px #0007;animation:deal .38s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";display:block;height:12px;margin:0 -12px;background:linear-gradient(90deg,var(--bc,#F2B705),var(--bc,#F2B705) 70%,#14213D);flex:none}
@keyframes deal{from{transform:translateY(16px) rotate(-1.2deg);opacity:0}to{transform:none;opacity:1}}
.chead{padding-top:2px}
.chead small::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bc,#888);margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 2px #14213D33}
.chead b{font-size:36px;letter-spacing:.03em}
.num.cpu{background:var(--red)}
.num{font-family:var(--disp);font-weight:400;font-size:17px;letter-spacing:.1em;padding:3px 12px 1px}
.photo{border-radius:14px;height:158px;box-shadow:inset 0 -26px 30px -18px #0004}
.photo:not(:has(img))::before{content:"";position:absolute;inset:0;background:radial-gradient(75% 90% at 50% 15%,#ffffff55,#0000 70%),linear-gradient(180deg,#0000 68%,#0003 68.5%,#0000 100%)}
.photo svg{position:relative}
.row{position:relative;padding:7px 6px 15px;min-height:60px;border-top:1.5px solid #14213D26;transition:background .15s}
.row .k{width:28px;height:28px;font-size:19px}
.row .v{font-size:38px}
.row .g{position:absolute;left:44px;right:6px;bottom:6px;height:5px;border-radius:3px;background:#14213D1f;overflow:hidden}
.row .g i{display:block;height:100%;border-radius:3px;background:var(--bc,#14213D)}
.row.canpick::after{content:"\203A";font-family:var(--disp);font-size:30px;line-height:1;color:var(--gold2);margin-left:-2px}
.row.canpick .k{animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 5px #F2B70055}}
.row.win{background:#4C956C44;box-shadow:inset 5px 0 0 #2f7a50}.row.lose{background:#C8352E33;box-shadow:inset 5px 0 0 #C8352E}.row.tie{box-shadow:inset 5px 0 0 var(--gold)}
.row.win .g i{background:#2f7a50}.row.lose .g i{background:#C8352E}
.card.compact .row{min-height:52px}
.card.compact .chead b{font-size:26px}
.back{height:96px;flex-direction:column;gap:2px;border-radius:20px;border:3px solid var(--deep);background:repeating-linear-gradient(45deg,#1B2B4F 0 10px,#26386b 10px 20px);box-shadow:0 6px 0 var(--deep),0 12px 20px #0006;outline:2px solid var(--gold);outline-offset:-10px;animation:deal .38s both}
.back span{font-size:30px;letter-spacing:.24em;text-indent:.24em}
.back small{font-family:var(--txt);font-size:12px;letter-spacing:.24em;color:#F4EAD2aa;text-transform:uppercase}
/* final */
.fin{padding:12px 0;gap:14px;align-items:stretch}
.res{position:relative;overflow:hidden;border:3px solid var(--gold);border-radius:26px;padding:26px 16px 34px;box-shadow:0 8px 0 #0008,0 16px 28px #0008;animation:deal .5s cubic-bezier(.2,.9,.2,1) both}
.res.you{background:linear-gradient(160deg,#58a77a,#1f5a3d)}.res.cpu{background:linear-gradient(160deg,#C8352E,#5e0d18)}.res.tie{background:linear-gradient(160deg,#6a7690,#2a3348)}
.res::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/14px 14px;opacity:.85}
.res.you::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 30%,#ffffff14 0 8deg,#0000 8deg 20deg);pointer-events:none}
.res .ic{font-size:70px;line-height:1;position:relative;animation:rebota 1.2s ease-in-out infinite}
@keyframes rebota{50%{transform:translateY(-8px)}}
.res h1{font-size:68px;color:#fff;text-shadow:0 4px 0 #0006;position:relative}
.pts{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--disp);font-size:64px;line-height:1;margin:4px 0 2px;position:relative}
.pts i{font-style:normal;color:var(--gold);font-size:40px}
.res .sub{color:#ffffffdd;position:relative}
.res .lab{display:flex;justify-content:center;gap:56px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#ffffffbb;position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function crearMazos(){
  const tec = {
    id:'tec', nombre:'Técnico', desc:'',
    stats:[
      {id:'cil',label:'Cilindrada',unit:'L',dir:1,hint:'mayor gana'},
      {id:'pot',label:'Potencia',unit:'CV',dir:1,hint:'mayor gana'},
      {id:'prod',label:'Años en producción',unit:'años',dir:1,hint:'mayor gana'},
      {id:'lanz',label:'Año de lanzamiento',unit:'',dir:-1,hint:'menor gana (el más antiguo)'}
    ],
    cards:TEC.filter(c => c[6] >= AMIN).map((c,i) => ({id:'t'+i,marca:c[0],modelo:c[1],shape:c[2],nota:c[7],key:c[8],est:{cil:!!c[9],pot:!!c[10]},v:{cil:c[3],pot:c[4],prod:c[5],lanz:c[6]}}))
  };
  const his = {
    id:'his', nombre:'Historia', desc:'',
    stats:[
      {id:'cil',label:'Cilindrada',unit:'L',dir:1,hint:'mayor gana'},
      {id:'pot',label:'Potencia',unit:'CV',dir:1,hint:'mayor gana'},
      {id:'prod',label:'Años en producción',unit:'años',dir:1,hint:'mayor gana'},
      {id:'lanz',label:'Año de lanzamiento',unit:'',dir:-1,hint:'menor gana (el más antiguo)'},
      {id:'fin',label:'Año de fin',unit:'',dir:1,hint:'mayor gana'}
    ],
    cards:HIS.filter(c => c[3] >= AMIN).map((c,i) => ({
      id:'h'+i,marca:c[0],modelo:c[1],shape:c[6],nota:c[2]+' · '+c[3]+'–'+c[4],key:c[5],
      est:{cil:!!CILPOT[c[5]][2],pot:!!CILPOT[c[5]][3]},
      v:{cil:CILPOT[c[5]][0],pot:CILPOT[c[5]][1],prod:c[4]-c[3],lanz:c[3],fin:c[4]}
    }))
  };

  tec.desc = tec.cards.length + ' versiones lanzadas de ' + AMIN + ' a 1999, de cualquier origen: cilindrada, potencia, años en producción y año de lanzamiento';
  his.desc = his.cards.length + ' modelos lanzados de ' + AMIN + ' a 1999: cilindrada, potencia (de una versión representativa), años en producción, lanzamiento y fin';

}

let IDB = null;
function idb(){
  if(IDB) return IDB;
  IDB = new Promise((ok, mal) => {
    try{
      const r = indexedDB.open('naipes80', 2);
      r.onupgradeneeded = () => { ['fotos'].forEach(n => { if(!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); }); };
      r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
    }catch(e){ mal(e); }
  });
  return IDB;
}
function idbOp(modo, fn, tienda){ tienda = tienda || 'fotos'; return idb().then(db => new Promise((ok, mal) => { const t = db.transaction(tienda, modo), q = fn(t.objectStore(tienda)); t.oncomplete = () => ok(q && q.result); t.onerror = () => mal(t.error); })); }

function nuevaPartida(){
  const deck = DECKS[S.pref.deck], t = TAMANOS[S.pref.size];
  const mitad = Math.floor(deck.cards.length/2);
  const n = t.n ? Math.min(t.n, mitad) : mitad;
  const mazo = mezclar(deck.cards.slice());
  S.game = {deckId:deck.id, you:mazo.slice(0,n), cpu:mazo.slice(n,2*n), pot:[], turn:Math.random()<.5?'you':'cpu',
            phase:'pick', sel:null, res:null, shown:null, ronda:1, quien:null, fin:null};
  S.screen = 'game';
  render();
  agendarCPU();
}
function percentil(deck, card, stat){
  let w = 0; deck.cards.forEach(o => { if(stat.dir*(card.v[stat.id]-o.v[stat.id]) >= 0) w++; });
  return w/deck.cards.length;
}
function agendarCPU(){
  const g = S.game;
  if(!g || g.phase !== 'pick' || g.turn !== 'cpu' || g.fin) return;
  clearTimeout(agendarCPU.t);
  agendarCPU.t = setTimeout(() => {
    if(S.screen !== 'game' || !S.game || S.game !== g || g.phase !== 'pick') return;
    const deck = DECKS[g.deckId], c = g.cpu[0];
    let mejor = null, pm = -1;
    deck.stats.forEach(s => { const p = percentil(deck,c,s) + Math.random()*0.15; if(p > pm){ pm = p; mejor = s; } });
    resolver(mejor.id, 'cpu');
  }, 1100);
}
function resolver(statId, quien){
  const g = S.game; if(!g || g.phase !== 'pick') return;
  const deck = DECKS[g.deckId], st = deck.stats.find(s => s.id === statId);
  const a = g.you[0], b = g.cpu[0];
  const d = st.dir*(a.v[st.id]-b.v[st.id]);
  g.sel = statId; g.quien = quien; g.phase = 'reveal'; g.shown = {a,b};
  g.you.shift(); g.cpu.shift();
  if(d > 0){ g.res = 'you'; g.you.push(a,b,...g.pot); g.pot = []; g.turn = 'you'; }
  else if(d < 0){ g.res = 'cpu'; g.cpu.push(b,a,...g.pot); g.pot = []; g.turn = 'cpu'; }
  else { g.res = 'tie'; g.pot.push(a,b); }
  render();
}
function siguiente(){
  const g = S.game; if(!g || g.phase !== 'reveal') return;
  g.ronda++;

  g.phase = 'pick'; g.sel = null; g.res = null; g.shown = null; g.quien = null;
  render();
  agendarCPU();
}
function terminar(){
  const g = S.game;
  let r;
  if(!g.you.length) r = 'cpu'; else if(!g.cpu.length) r = 'you';
  else r = g.you.length > g.cpu.length ? 'you' : g.cpu.length > g.you.length ? 'cpu' : 'tie';
  g.fin = r;
  if(r === 'you') S.rec.g++; else if(r === 'cpu') S.rec.p++; else S.rec.e++;

  S.screen = 'fin';
  render();
}

}
async function accionCarpeta(a, id){
  const sc = ambito(id);
  try{
    if(a === 'zip-exp'){
      const fs = sc.items.filter(it => sc.store[it.key]).map(it => ({name:it.file, data:aBytes(sc.store[it.key])}));
      if(!fs.length){ aviso('No hay fotos para exportar'); return; }
      bajar(zipCrear(fs), sc.zip); aviso(fs.length + ' fotos exportadas en ' + sc.zip);
    } else if(a === 'zip-imp'){ S.imp = id; IMP.click();
    } else if(a === 'fs-guardar'){
      const sub = await (await carpetaRaiz(false)).getDirectoryHandle(sc.dir, {create:true}); let n = 0;
      for(const it of sc.items){ if(!sc.store[it.key]) continue;
        const w = await (await sub.getFileHandle(it.file, {create:true})).createWritable();
        await w.write(new Blob([aBytes(sc.store[it.key])], {type:'image/jpeg'})); await w.close(); n++; }
      aviso(n ? n + ' fotos guardadas en la carpeta ' + sc.dir : 'No hay fotos para guardar');
    } else if(a === 'fs-cargar'){
      const sub = await (await carpetaRaiz(false)).getDirectoryHandle(sc.dir, {create:true}), es = [];
      for await (const [nombre, h] of sub.entries()) if(h.kind === 'file') es.push({name:nombre, blob:await h.getFile()});
      await importar(sc, es);
    } else if(a === 'fs-elegir'){
      const r = await carpetaRaiz(true); aviso('Carpeta elegida: ' + r.name);
    }
  }catch(e){ if(e && e.name !== 'AbortError') aviso(e.message === 'permiso' ? 'Sin permiso para usar la carpeta' : 'No se pudo completar'); }
}
IMP.addEventListener('change', async () => {
  const fs = Array.from(IMP.files || []), id = S.imp; IMP.value = '';
  if(!fs.length || !id) return;
  const es = [];
  try{
    for(const f of fs){
      if(/\.zip$/i.test(f.name)) (await zipLeer(await f.arrayBuffer())).forEach(e => es.push(e));
      else es.push({name:f.name, blob:f});
    }
  }catch(e){ aviso('No se pudo leer el archivo'); return; }
  await importar(ambito(id), es);
});

// ---------- Carga por lote ----------
const LOTE = document.getElementById('filelote');
function loteOpciones(){
  const L = S.lote, sc = ambito(L.id), toks = slug(L.q).split('-').filter(Boolean);
  let it = sc.items;
  if(toks.length) it = it.filter(x => { const t = slug(x.label); return toks.every(k => t.indexOf(k) >= 0); });
  else return '<div class="note">Escribí el nombre del modelo para encontrar su casillero.</div>';
  if(!it.length) return '<div class="note">No hay casilleros con ese nombre.</div>';
  return it.slice(0, 8).map(x => `<button class="op" data-act="lote-asignar" data-key="${esc(x.key)}"><span>${esc(x.label)}</span>${sc.store[x.key] ? '<small>ya tiene foto</small>' : ''}</button>`).join('') +
    (it.length > 8 ? `<div class="note">Hay ${it.length - 8} más: escribí más letras para afinar.</div>` : '');
}
function pantallaLote(){
  const L = S.lote, f = L.cola[L.i];
  return `<div class="bar"><button class="btn sm" data-act="lote-fin">Terminar</button><div class="sub">Foto ${L.i + 1} de ${L.cola.length} · ${L.hechas} asignadas</div></div>
    <div class="lote"><img class="prev" src="${f.src}" alt="">
      <input id="lq" type="search" placeholder="¿De qué modelo es? Escribí el nombre…" value="${esc(L.q)}" autocomplete="off">
      <div id="llist" class="lote">${loteOpciones()}</div>
      <div class="row2"><button class="btn" data-act="lote-saltar">Saltar esta foto</button></div></div>`;
}
function loteSiguiente(){
  const L = S.lote; L.i++;
  if(L.i >= L.cola.length){ loteFin(); return; }
  L.q = L.cola[L.i].q; render(); window.scrollTo(0,0);
}
function loteFin(){
  const L = S.lote; S.screen = 'fotos'; S.lote = null;
  aviso(L.hechas + (L.hechas === 1 ? ' foto asignada' : ' fotos asignadas') + (S.guardar ? '' : '. No se guardan en el navegador')); render(); window.scrollTo(0,0);
}
async function loteAsignar(key){
  const L = S.lote, sc = ambito(L.id), f = L.cola[L.i];
  S.fotos[key] = f.src;
  if(S.guardar) await idbAutos(st => st.put(f.src, key)).catch(() => aviso('Se ve ahora, pero no se pudo guardar'));
  L.hechas++; loteSiguiente();
}
LOTE.addEventListener('change', async () => {
  const fs = Array.from(LOTE.files || []), id = S.imp; LOTE.value = '';
  if(!fs.length || !id) return;
  const sc = ambito(id), cola = []; aviso('Preparando ' + fs.length + ' fotos…');
  for(const f of fs){
    try{
      const src = await leerFoto(f, sc.max, sc.q), base = f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
      const q = /[a-zA-Z]{3}/.test(base) && !/^(img|dsc|pxl|photo|image|foto)/i.test(base) ? base : '';
      cola.push({src, q});
    }catch(e){}
  }
  if(!cola.length){ aviso('No se pudieron leer esas fotos'); return; }
  S.lote = {id, cola, i:0, hechas:0, q:cola[0].q}; S.screen = 'lote'; render(); window.scrollTo(0,0);
});

// ---------- Búsqueda automática de fotos ----------
const FUENTES = {
  autos: [{base:'https://es.wikipedia.org/w/api.php', n:'Wikipedia'}, {base:'https://en.wikipedia.org/w/api.php', n:'Wikipedia (inglés)'}]
};
async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error('http'); return r.json(); }
function validarTitulo(id, it, titulo){
  const t = slug(titulo), toks = slug(it.q).split('-').filter(Boolean);
  const mt = slug(it.marca).split('-').filter(Boolean);
  return mt.some(k => t.indexOf(k) >= 0) && (!toks.length || t.indexOf(toks[0]) >= 0);
}
async function urlFoto(id, it, px){
  for(const f of FUENTES[id]){
    const q = it.marca + ' ' + it.q;
    const u = f.base + '?action=query&generator=search&gsrsearch=' + encodeURIComponent(q) + '&gsrlimit=6&prop=pageimages&piprop=thumbnail&pithumbsize=' + px + '&format=json&origin=*';
    const j = await jget(u), ps = Object.values((j.query || {}).pages || {}).sort((a,b) => a.index - b.index);
    for(const pg of ps) if(pg.thumbnail && validarTitulo(id, it, pg.title)) return pg.thumbnail.source;
  }
  return null;
}
function itemsSinFoto(id){
  const sc = ambito(id), st = sc.store;
  return sc.items.filter(it => !st[it.key]);
}
function panelBusq(){
  const B = S.busq; if(!B) return '';
  if(B.fin) return `<div class="busq"><b>Búsqueda terminada</b><div>Encontré ${B.ok} de ${B.total} fotos.${B.error ? ' ' + esc(B.error) : ''}</div>
    <small>Son fotos de Wikipedia (licencias libres, para uso personal). Revisalas: si alguna no es la correcta, tocá "Quitar foto".</small>
    <div class="row2">${B.claves.length ? '<button class="btn sm" data-act="busq-deshacer">Deshacer lo encontrado</button>' : ''}<button class="btn sm" data-act="busq-cerrar">Cerrar</button></div></div>`;
  return `<div class="busq"><b>Buscando fotos… ${B.i} de ${B.total}</b><div class="prog" style="margin:0"><span style="width:${Math.round(100*B.i/B.total)}%"></span></div>
    <div>${B.ok} encontradas</div><div class="row2"><button class="btn sm" data-act="busq-parar">Detener</button></div></div>`;
}
function contenidoBusq(id){
  if(S.busq) return S.busq.id === id ? panelBusq() : '';
  const n = itemsSinFoto(id).length;
  return n ? `<button class="btn" data-act="busq-iniciar" data-sc="${id}">Buscar fotos automáticamente (${n})</button>` : '';
}
function pintarBusq(){ const e = document.getElementById('busq'); if(e) e.innerHTML = contenidoBusq(e.dataset.sc); }
function botonBusq(id){ return `<div id="busq" data-sc="${id}">${contenidoBusq(id)}</div>`; }
async function buscarFotos(id){
  const sc = ambito(id), lista = itemsSinFoto(id);
  if(!lista.length) return;
  if(lista.length > 150 && !confirm('Se van a buscar ' + lista.length + ' fotos, una por una. Puede tardar varios minutos y usa datos móviles. ¿Seguir?')) return;
  const B = S.busq = {id, total:lista.length, i:0, ok:0, claves:[], fin:false, parar:false, errores:0, error:''};
  const encontradas = {}, px = sc.max, store = sc.store;
  render(); pintarBusq();
  let idx = 0;
  const obrero = async () => {
    while(!B.parar && idx < lista.length){
      const it = lista[idx++];
      try{
        const u = await urlFoto(id, it, px);
        if(u){
          const r = await fetch(u); if(!r.ok) throw new Error('img');
          const src = await leerFoto(await r.blob(), sc.max, sc.q);
          if(!store[it.key]){ store[it.key] = src; encontradas[it.key] = src; B.claves.push(it.key); B.ok++; }
        }
        B.errores = 0;
      }catch(e){ B.errores++; if(B.errores >= 5 && !B.ok){ B.parar = true; B.error = 'No pude conectarme: revisá internet o probá más tarde.'; } }
      B.i++; pintarBusq();
    }
  };
  await Promise.all([obrero(), obrero(), obrero()]);
  B.fin = true; B.i = Math.min(B.i, B.total);
  const ks = Object.keys(encontradas);
  if(ks.length && S.guardar){
    await idbAutos(o => { ks.forEach(k => o.put(encontradas[k], k)); }).catch(() => { B.error = 'Se ven ahora, pero no se pudieron guardar.'; });
  }
  if(S.busq === B){ if(S.screen === 'fotos') render(); }
}
function busqDeshacer(){
  const B = S.busq; if(!B) return;
  B.claves.forEach(k => delete S.fotos[k]);
  idbAutos(o => { B.claves.forEach(k => o.delete(k)); }).catch(() => {});
  S.busq = null; aviso('Listo, deshice la búsqueda'); render();
}
function herramientasCarpeta(id){
  const auto = botonBusq(id);
  const lote = `<button class="btn" data-act="lote" data-sc="${id}">Cargar varias fotos</button>`;
  const fs = FS_OK ? `<div class="row2"><button class="btn sm" data-act="fs-guardar" data-sc="${id}">Guardar en carpeta</button><button class="btn sm" data-act="fs-cargar" data-sc="${id}">Cargar desde carpeta</button><button class="btn sm" data-act="fs-elegir" data-sc="${id}">Elegir carpeta</button></div>
    <small>Elegí una carpeta del dispositivo (por ejemplo "Naipes"). La app crea adentro la subcarpeta "${ambito(id).dir}".</small>` : '';
  return auto + lote + `<details class="cartools"><summary><b>Carpeta en el dispositivo y copia de seguridad</b></summary>${fs}
    <div class="row2"><button class="btn sm" data-act="zip-exp" data-sc="${id}">Exportar .zip</button><button class="btn sm" data-act="zip-imp" data-sc="${id}">Importar fotos</button></div>
    <small>${FS_OK ? '' : 'Este navegador no permite elegir carpetas: el .zip se baja a Descargas. '}Importar acepta un .zip de la app o fotos sueltas con el mismo nombre de archivo.</small></details>`;
}
function portadaAlbum(id){
  const sc = ambito(id), st = sc.store, tot = sc.items.length, ks = sc.items.filter(it => st[it.key]), n = ks.length;
  const col = [0,1,2].map(i => ks[i] ? `<i style="background-image:url(${st[ks[i].key]})"></i>` : `<i>&#128663;</i>`).join('');
  return `<button class="alb ${id}" data-act="fotos"><div class="col">${col}</div>
    <b>Autos</b><small>${n} de ${tot} fotos</small>
    <div class="prog"><span style="width:${Math.round(100*n/tot)}%"></span></div></button>`;
}
function heroAlbum(id, n, tot){
  const pc = Math.round(100*n/tot);
  return `<div class="hero ${id}"><div class="k">Álbum de fotos</div><h2>Autos</h2>
    <div class="prog"><span style="width:${pc}%"></span></div>
    <div class="cnt"><span>${n} de ${tot}</span><span>${pc}%</span></div>
    ${n === tot ? '<div class="win">&#127942; ¡Álbum completo!</div>' : ''}</div>`;
}
function pantallaFotos(){
  const cant = MODELOS.filter(m => S.fotos[m.key]).length;
  return `<div class="bar"><button class="btn sm" data-act="home">Volver</button></div>${heroAlbum('autos', cant, MODELOS.length)}
    <div class="note">Tocá un modelo para elegir una foto de tu galería o sacarla con la cámara. Se ven en todas las cartas de ese modelo, en los dos mazos.</div>
    ${switchGuardar()}
    ${herramientasCarpeta('autos')}
    <div class="grid">${MODELOS.map(tileFoto).join('')}</div>`;
}
function render(){
  APP.innerHTML = S.screen === 'game' ? pantallaJuego() : S.screen === 'fin' ? pantallaFin() : S.screen === 'fotos' ? pantallaFotos() : S.screen === 'lote' ? pantallaLote() : pantallaInicio();
  document.body.dataset.fondo = S.screen === 'fotos' || S.screen === 'lote' ? 'autos' : '';
  if(!document.body.dataset.fondo) delete document.body.dataset.fondo;
  if(S.screen === 'game' || S.screen === 'fin') window.scrollTo(0,0);
}

// ---------- Fotos ----------
function leerFoto(file, max, q){
  max = max || 640; q = q || 0.72;
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}
FILE.addEventListener('change', async () => {
  const f = FILE.files && FILE.files[0], key = S.pending;
  FILE.value = '';
  if(!f || !key) return;
  try{
    const data = await leerFoto(f);
    S.fotos[key] = data;
    if(!S.guardar) aviso('Foto cargada. No se guarda: se pierde al cerrar la app');
    else{ try{ await idbAutos(st => st.put(data, key)); aviso('Foto guardada'); }
    catch(e){ aviso('Se ve ahora, pero no se pudo guardar en este dispositivo'); } }
  }catch(e){ aviso('No se pudo leer esa imagen'); }
  render();
});

// ---------- Eventos (delegación) ----------
APP.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'deck'){ S.pref.deck = b.dataset.v; guardar(LS_PREF,S.pref); render(); }
  else if(a === 'size'){ S.pref.size = b.dataset.v; guardar(LS_PREF,S.pref); render(); }
  else if(a === 'jugar') nuevaPartida();
  else if(a === 'stat'){ if(S.game && S.game.phase === 'pick' && S.game.turn === 'you') resolver(b.dataset.stat,'you'); }
  else if(a === 'next') siguiente();
  else if(a === 'salir'){ if(confirm('¿Salir de la partida?')){ clearTimeout(agendarCPU.t); S.game = null; S.screen = 'home'; render(); } }
  else if(a === 'home'){ clearTimeout(agendarCPU.t); S.screen = 'home'; render(); }
  else if(a === 'fotos'){ S.screen = 'fotos'; render(); }
  else if(a === 'foto'){ S.pending = b.dataset.key; FILE.click(); }
  else if(a === 'quitar'){ const k = b.dataset.key; delete S.fotos[k]; idbAutos(st => st.delete(k)).catch(() => {}); render(); }
  else if(a === 'busq-iniciar') buscarFotos(b.dataset.sc);
  else if(a === 'busq-parar'){ if(S.busq) S.busq.parar = true; }
  else if(a === 'busq-deshacer') busqDeshacer();
  else if(a === 'busq-cerrar'){ S.busq = null; render(); }
  else if(a === 'lote'){ S.imp = b.dataset.sc; LOTE.click(); }
  else if(a === 'lote-asignar') loteAsignar(b.dataset.key);
  else if(a === 'lote-saltar') loteSiguiente();
  else if(a === 'lote-fin') loteFin();
  else if(/^(zip-exp|zip-imp|fs-guardar|fs-cargar|fs-elegir)$/.test(a)) accionCarpeta(a, b.dataset.sc);
  else if(a === 'instalar' && S.deferred){ S.deferred.prompt(); S.deferred.userChoice.finally(() => { S.deferred = null; render(); }); }
});
APP.addEventListener('change', e => { if(e.target.id === 'sw-guardar') cambiarGuardar(e.target.checked); });
APP.addEventListener('input', e => { if(e.target.id === 'lq'){ S.lote.q = e.target.value; document.getElementById('llist').innerHTML = loteOpciones(); } });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.deferred = e; if(S.screen === 'home') render(); });
window.addEventListener('appinstalled', () => { S.deferred = null; if(S.screen === 'home') render(); });

// ---------- Arranque ----------
cargar();
cargarFotos();
render();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
